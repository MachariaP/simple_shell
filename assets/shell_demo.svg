<svg width="800" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal Background -->
  <rect width="800" height="500" fill="#300A24" rx="10"/>
  
  <!-- Terminal Header Bar -->
  <rect width="800" height="35" fill="#2C0A1F" rx="10"/>
  <circle cx="20" cy="17.5" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="17.5" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="17.5" r="6" fill="#27C93F"/>
  <text x="400" y="23" font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle">simple_shell - Terminal</text>
  
  <!-- Terminal Content -->
  <text x="20" y="65" font-family="monospace" font-size="14" fill="#FFFFFF">runner@ubuntu:~/simple_shell$ ./hsh</text>
  <text x="20" y="95" font-family="monospace" font-size="14" fill="#4E9A06">$</text>
  <text x="35" y="95" font-family="monospace" font-size="14" fill="#FFFFFF">ls</text>
  
  <text x="20" y="125" font-family="monospace" font-size="13" fill="#729FCF">AUTHORS</text>
  <text x="150" y="125" font-family="monospace" font-size="13" fill="#729FCF">README.md</text>
  <text x="280" y="125" font-family="monospace" font-size="13" fill="#729FCF">cd_builtin.c</text>
  <text x="20" y="150" font-family="monospace" font-size="13" fill="#729FCF">env_builtins.c</text>
  <text x="150" y="150" font-family="monospace" font-size="13" fill="#729FCF">execute.c</text>
  <text x="280" y="150" font-family="monospace" font-size="13" fill="#729FCF">getenv.c</text>
  <text x="20" y="175" font-family="monospace" font-size="13" fill="#729FCF">handle_builtin.c</text>
  <text x="180" y="175" font-family="monospace" font-size="13" fill="#729FCF">handle_path.c</text>
  <text x="340" y="175" font-family="monospace" font-size="13" fill="#34E2E2">hsh</text>
  <text x="20" y="200" font-family="monospace" font-size="13" fill="#729FCF">main.c</text>
  <text x="150" y="200" font-family="monospace" font-size="13" fill="#729FCF">readline.c</text>
  <text x="280" y="200" font-family="monospace" font-size="13" fill="#729FCF">shell.h</text>
  
  <text x="20" y="235" font-family="monospace" font-size="14" fill="#4E9A06">$</text>
  <text x="35" y="235" font-family="monospace" font-size="14" fill="#FFFFFF">pwd</text>
  <text x="20" y="265" font-family="monospace" font-size="14" fill="#FFFFFF">/home/runner/work/simple_shell/simple_shell</text>
  
  <text x="20" y="300" font-family="monospace" font-size="14" fill="#4E9A06">$</text>
  <text x="35" y="300" font-family="monospace" font-size="14" fill="#FFFFFF">echo "Simple Shell is working!"</text>
  <text x="20" y="330" font-family="monospace" font-size="14" fill="#FFFFFF">Simple Shell is working!</text>
  
  <text x="20" y="365" font-family="monospace" font-size="14" fill="#4E9A06">$</text>
  <text x="35" y="365" font-family="monospace" font-size="14" fill="#FFFFFF">env | grep PATH</text>
  <text x="20" y="395" font-family="monospace" font-size="13" fill="#FFFFFF">PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin</text>
  
  <text x="20" y="430" font-family="monospace" font-size="14" fill="#4E9A06">$</text>
  <text x="35" y="430" font-family="monospace" font-size="14" fill="#FFFFFF">exit</text>
  <text x="20" y="465" font-family="monospace" font-size="14" fill="#FFFFFF">runner@ubuntu:~/simple_shell$</text>
  <rect x="360" y="451" width="10" height="18" fill="#FFFFFF" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0;0.7" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
